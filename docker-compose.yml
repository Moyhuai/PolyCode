services:
  polycode:
    build: .
    image: polycode:latest
    container_name: polycode
    restart: unless-stopped
    init: true
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
    volumes:
      # 分享数据持久化；命名卷首次挂载会继承镜像内 /app/.data 的属主
      - polycode-data:/app/.data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 限制用户代码占用的资源，避免单次运行拖垮整台 VM
    pids_limit: 512
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  polycode-data:
